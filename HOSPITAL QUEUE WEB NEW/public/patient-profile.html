<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediQueue | My Profile</title><style>html:not(.mq-theme-ready) body{visibility:hidden!important}</style><link rel="stylesheet" href="account.css"><style>.profile-actions{display:flex;flex-wrap:wrap;gap:12px}.profile-actions a{padding:10px 0}form{margin:22px 0}button{width:100%}.hint{opacity:.75;font-size:.9rem}#notice{min-height:1.5em}#notice.error{color:#b42318}#notice.success{color:#147d43}</style></head><body><main class="wide"><img id="accountBrandLogo" alt="Hospital logo" hidden><h1>My profile</h1><nav class="profile-actions"><a href="/patient.html">← Queue portal</a><a href="/patient-history.html">Visit history</a><a href="/patient-appointments.html">My appointments</a></nav><p id="notice" role="status" aria-live="polite"></p><section><h2>Personal information</h2><form id="profileForm"><label>Full name<input name="fullName" required minlength="2" maxlength="100" autocomplete="name"></label><label>Username<input name="username" readonly autocomplete="username"></label><p class="hint">Your username cannot be changed here.</p><button type="submit">Save profile</button></form></section><section><h2>Change password</h2><form id="passwordForm"><label>Current password<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>New password<input name="newPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><label>Confirm new password<input name="confirmPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><p class="hint">Use at least 10 characters. Your password is never displayed.</p><button type="submit">Change password</button></form></section></main><script src="account-theme.js"></script><script src="patient-profile.js"></script></body></html>
