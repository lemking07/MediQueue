<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediQueue | Book an appointment</title><style>html:not(.mq-theme-ready) body{visibility:hidden!important}*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:var(--account-bg,#f6f3ff);color:var(--account-text,#222);margin:0}main{max-width:850px;margin:24px auto;padding:24px;background:var(--account-card,#fff);border-radius:18px}header{display:flex;gap:15px;align-items:center}#accountBrandLogo{height:48px;max-width:80px;object-fit:contain}nav{display:flex;gap:15px;flex-wrap:wrap;margin:20px 0}a{color:var(--account-primary,#7047e8)}form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;flex:1;min-width:145px}input,select,button{padding:11px;border:1px solid #9997;border-radius:9px;font:inherit;max-width:100%}button{background:var(--account-primary,#7047e8);color:var(--account-button-text,#fff);cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #9995;text-align:left}#message{min-height:24px} .scroll{overflow:auto}@media(max-width:600px){main{margin:0;padding:15px;border-radius:0}table{font-size:13px}td,th{padding:7px}}</style></head><body><main><header><img id="accountBrandLogo" alt="Hospital logo" hidden><h1>Book an appointment</h1></header><nav><a href="/patient.html">Queue portal</a><a href="/patient-profile.html">My profile</a></nav><p id="message" role="status" aria-live="polite"></p><form id="search"><label>Department<select id="department" required></select></label><label>Date<input id="date" type="date" required></label><button>Show available slots</button></form><h2>Available slots</h2><div class="scroll"><table><thead><tr><th>Time</th><th>Available</th><th>Action</th></tr></thead><tbody id="slots"></tbody></table></div><h2>My appointments</h2><div class="scroll"><table><thead><t
