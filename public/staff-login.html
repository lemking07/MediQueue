<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediQueue | Staff Login</title>

    <!-- Critical styles prevent a default/unstyled login flash on refresh. -->
    <style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f0ff;color:#24203d}.auth-card{width:min(100%,460px);padding:clamp(22px,5vw,38px);background:white;border-radius:20px;box-shadow:0 12px 40px #26135d18}h1{font-size:clamp(1.6rem,5vw,2rem);margin:0 0 8px}p{margin:8px 0 20px}label{display:block;margin:14px 0;font-weight:600}input{display:block;width:100%;max-width:100%;padding:13px;margin-top:6px;border:1px solid #b9b3d0;border-radius:10px;font:inherit}button[type=submit]{width:100%;background:#7047e8;color:white;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}a{color:#5631c3}.password-toggle{margin:5px 0 12px;background:transparent;border:0;color:#5631c3;cursor:pointer;padding:5px}#msg,#login-message{min-height:1.4em;overflow-wrap:anywhere}@media(max-width:480px){body{padding:14px}.auth-card{padding:22px}}
.auth-switch{border-top:1px solid #e5e0f2;padding-top:18px;margin-top:20px;text-align:center;font-size:.93rem}.auth-switch button{border:0;background:transparent;color:#5631c3;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;padding:5px}.auth-switch button:focus-visible{outline:2px solid #7047e8;outline-offset:3px}[hidden]{display:none!important}

    </style>
    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>

    <main class="auth-card">

        <div>

            <h1 id="login-heading">
                Staff Login
            </h1>

            <p>
                <span id="login-description">Login to access the hospital staff dashboard.</span>
            </p>


            <form id="login-form">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                    style="
                        width: 100%;
                        padding: 15px;
                        margin-bottom: 15px;
                        border: 1px solid #ccc;
                        border-radius: 8px;
                        font-size: 16px;
                    "
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                    style="
                        width: 100%;
                        padding: 15px;
                        margin-bottom: 15px;
                        border: 1px solid #ccc;
                        border-radius: 8px;
                        font-size: 16px;
                    "
                >

                <button
                    type="submit"
                    class="button"
                >
                    <span id="login-button-text">Login as Staff</span>
                </button>

            </form><p id="staff-signup-link"><a href="/staff-signup.html">Create a staff account</a></p>
            <div class="auth-switch"><span id="switch-description">Are you an administrator?</span> <button type="button" id="switch-login" aria-label="Switch to Admin Login">Admin Login</button></div>


            <p
                id="login-message"
                style="
                    color: red;
                    margin-top: 15px;
                "
            >
            </p>

        </div>

    </main>


    <script>

        const loginForm =
            document.getElementById(
                "login-form"
            );

        const loginMessage =
            document.getElementById(
                "login-message"
            );


        let loginRole = 'staff';
        const switchLogin = document.getElementById('switch-login');
        switchLogin.addEventListener('click', () => {
            loginRole = loginRole === 'staff' ? 'admin' : 'staff';
            const isAdmin = loginRole === 'admin';
            document.getElementById('login-heading').textContent = isAdmin ? 'Admin Login' : 'Staff Login';
            document.getElementById('login-description').textContent = isAdmin ? 'Sign in with your administrator account.' : 'Login to access the hospital staff dashboard.';
            document.getElementById('login-button-text').textContent = isAdmin ? 'Login as Admin' : 'Login as Staff';
            document.getElementById('switch-description').textContent = isAdmin ? 'Are you a staff member?' : 'Are you an administrator?';
            switchLogin.textContent = isAdmin ? 'Staff Login' : 'Admin Login';
            switchLogin.setAttribute('aria-label', isAdmin ? 'Switch to Staff Login' : 'Switch to Admin Login');
            document.getElementById('staff-signup-link').hidden = isAdmin;
            loginMessage.textContent = '';
            document.getElementById('password').value = '';
            document.title = `MediQueue | ${isAdmin ? 'Admin' : 'Staff'} Login`;
        });

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                loginMessage.textContent =
                    "Logging in...";


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                try {

                    const response =
                        await fetch(
                            "/api/staff/login",
                            {
                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username:
                                            username,

                                        password:
                                            password,
                                        loginRole: loginRole
                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        loginMessage.textContent =
                            result.error ||
                            "Login failed.";

                        return;
                    }


                    window.location.replace(
                        "/staff.html"
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    loginMessage.textContent =
                        "Unable to connect to server.";
                }

            }
        );

    </script>

<script>
document.querySelectorAll('input[type="password"]').forEach(input => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "password-toggle";
  button.textContent = "👁";
  button.setAttribute("aria-label", "Show password");

  input.insertAdjacentElement("afterend", button);

  button.addEventListener("click", () => {
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    button.setAttribute(
      "aria-label",
      show ? "Hide password" : "Show password"
    );
    button.textContent = show ? "🙈" : "👁";
  });
});
</script>

</body>

</html>
