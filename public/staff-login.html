<!DOCTYPE html>
<html lang="en">

<head>
<style>html:not(.mq-theme-ready) body{visibility:hidden!important}</style>
<meta name="theme-color" content="#7047e8">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediQueue | Staff Login</title>
    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>

    <main class="auth-card">
<img id="accountBrandLogo" alt="Hospital logo" hidden>
<p id="brandName" class="mq-brand-name">MediQueue</p>

        <div>

            <h1 id="login-heading">
                Staff Login
            </h1>

            <p>
                <span id="login-description">Login to access the hospital staff dashboard.</span>
            </p>


            <form id="login-form">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                    style="
                        width: 100%;
                        padding: 15px;
                        margin-bottom: 15px;
                        border: 1px solid #ccc;
                        border-radius: 8px;
                        font-size: 16px;
                    "
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                    style="
                        width: 100%;
                        padding: 15px;
                        margin-bottom: 15px;
                        border: 1px solid #ccc;
                        border-radius: 8px;
                        font-size: 16px;
                    "
                >

                <button
                    type="submit"
                    class="button"
                >
                    <span id="login-button-text">Login as Staff</span>
                </button>

            </form><p id="staff-signup-link"><a href="/staff-signup.html">Create a staff account</a></p>
            <div class="auth-switch"><span id="switch-description">Are you an administrator?</span> <button type="button" id="switch-login" aria-label="Switch to Admin Login">Admin Login</button></div>


            <p
                id="login-message"
                style="
                    color: red;
                    margin-top: 15px;
                "
            >
            </p>

        </div>

    </main>


    <script>

        const loginForm =
            document.getElementById(
                "login-form"
            );

        const loginMessage =
            document.getElementById(
                "login-message"
            );


        let loginRole = 'staff';
        const switchLogin = document.getElementById('switch-login');
        switchLogin.addEventListener('click', () => {
            loginRole = loginRole === 'staff' ? 'admin' : 'staff';
            const isAdmin = loginRole === 'admin';
            document.getElementById('login-heading').textContent = isAdmin ? 'Admin Login' : 'Staff Login';
            document.getElementById('login-description').textContent = isAdmin ? 'Sign in with your administrator account.' : 'Login to access the hospital staff dashboard.';
            document.getElementById('login-button-text').textContent = isAdmin ? 'Login as Admin' : 'Login as Staff';
            document.getElementById('switch-description').textContent = isAdmin ? 'Are you a staff member?' : 'Are you an administrator?';
            switchLogin.textContent = isAdmin ? 'Staff Login' : 'Admin Login';
            switchLogin.setAttribute('aria-label', isAdmin ? 'Switch to Staff Login' : 'Switch to Admin Login');
            document.getElementById('staff-signup-link').hidden = isAdmin;
            loginMessage.textContent = '';
            document.getElementById('password').value = '';
            document.title = `MediQueue | ${isAdmin ? 'Admin' : 'Staff'} Login`;
        });

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                loginMessage.textContent =
                    "Logging in...";


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                try {

                    const response =
                        await fetch(
                            "/api/staff/login",
                            {
                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username:
                                            username,

                                        password:
                                            password,
                                        loginRole: loginRole
                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        loginMessage.textContent =
                            result.error ||
                            "Login failed.";

                        return;
                    }


                    window.location.replace(
                        "/staff.html"
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    loginMessage.textContent =
                        "Unable to connect to server.";
                }

            }
        );

    </script>

<script>
document.querySelectorAll('input[type="password"]').forEach(input => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "password-toggle";
  button.textContent = "👁";
  button.setAttribute("aria-label", "Show password");

  input.insertAdjacentElement("afterend", button);

  button.addEventListener("click", () => {
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    button.setAttribute(
      "aria-label",
      show ? "Hide password" : "Show password"
    );
    button.textContent = show ? "🙈" : "👁";
  });
});
</script>

<script src="account-theme.js"></script>
</body>

</html>
